<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- pako: Necessário para o UPNG.js descompactar dados -->
    <script src="https://cdn.jsdelivr.net/npm/pako@1.0.11/dist/pako.min.js"></script>
    <!-- UPNG.js: PNG decoder/encoder com quantização 8-bit indexada (equivalente ao pngquant) -->
    <script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.min.js"></script>
    <style>
        :root {
            --eyxo-blue: #0000FF;
            --eyxo-bg: #000000;
            --eyxo-surface: #0A0A0A;
            --eyxo-surface-hover: #141414;
            --eyxo-border: #1F1F1F;
            --eyxo-text: #FFFFFF;
            --eyxo-text-muted: #8F8F8F;
            --eyxo-font-ui: 'Moderat', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --eyxo-font-mono: 'Moderat Mono', 'Courier New', Courier, monospace;
        }
        body {
            font-family: var(--eyxo-font-ui);
            background-color: var(--eyxo-bg); color: var(--eyxo-text);
            margin: 0; padding: 24px; display: flex; flex-direction: column;
            height: 100vh; box-sizing: border-box;
        }
        h1 { font-size: 20px; font-weight: 700; margin-top: 0; margin-bottom: 5px; letter-spacing: -0.5px; }
        p  { color: var(--eyxo-text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; font-weight: 400; }
        .btn {
            background-color: var(--eyxo-blue); color: var(--eyxo-text); border: none;
            padding: 14px; border-radius: 8px; font-size: 12px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            width: 100%; transition: all 0.2s; margin-top: auto;
            display: flex; justify-content: center; align-items: center;
            font-family: var(--eyxo-font-ui);
        }
        .btn:hover { background-color: #0000D1; }
        .btn:disabled { background-color: #333; color: #777; cursor: not-allowed; }
        .btn-outline { background-color: transparent; border: 1px solid var(--eyxo-border); margin-top: 10px; }
        .btn-outline:hover { background-color: var(--eyxo-surface); }
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .selection-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; flex: 1; overflow-y: auto; padding-right: 4px; }
        .empty-state { padding: 20px; text-align: center; background: var(--eyxo-surface); border: 1px dashed var(--eyxo-border); border-radius: 8px; color: var(--eyxo-text-muted); font-size: 13px; margin-bottom: 24px; }
        .file-item { background: var(--eyxo-surface); border: 1px solid var(--eyxo-border); border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 12px; transition: border-color 0.2s, opacity 0.15s; cursor: pointer; }
        .file-item:hover { border-color: #333; }
        .file-item.is-original { border: 1px dashed var(--eyxo-border); opacity: 0.8; cursor: default; }
        .file-item.unchecked { opacity: 0.35; }
        input[type="checkbox"] { accent-color: var(--eyxo-blue); width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
        .file-item-info { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .file-item-name { font-size: 13px; font-weight: 600; white-space: normal; word-break: break-word; line-height: 1.3; }
        .file-item-meta { font-size: 12px; color: var(--eyxo-text-muted); margin-top: 4px; font-family: var(--eyxo-font-mono); }
        .file-item-meta .ok { color: #4CAF50; font-weight: 600; }
        .file-item-meta .badge-original { color: #888; font-weight: 500; font-family: var(--eyxo-font-ui); font-size: 10px; padding: 2px 4px; background: #222; border-radius: 4px; }
        .target-input-group { display: flex; align-items: center; background: var(--eyxo-bg); border: 1px solid var(--eyxo-border); border-radius: 6px; padding: 4px 8px; width: 70px; flex-shrink: 0; }
        .target-input-group:focus-within { border-color: var(--eyxo-blue); }
        select.kb-input { background: transparent; border: none; color: var(--eyxo-text); font-family: var(--eyxo-font-mono); font-size: 13px; font-weight: 500; width: 100%; outline: none; text-align: right; cursor: pointer; -webkit-appearance: none; appearance: none; }
        select.kb-input option { background: var(--eyxo-surface); color: var(--eyxo-text); }
        .kb-suffix { color: var(--eyxo-text-muted); font-size: 11px; margin-left: 4px; font-weight: 600; pointer-events: none; }
        .file-item-thumb { width: 44px; height: 44px; border-radius: 4px; background: #1a1a1a; object-fit: cover; flex-shrink: 0; transition: transform 0.2s; align-self: flex-start; }
        .file-item-thumb:hover { transform: scale(1.05); }
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; cursor: pointer; flex-direction: column; }
        #lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; }
        #lightbox p { margin-top: 15px; color: #fff; font-size: 12px; }
        #panel-loading { justify-content: center; align-items: center; text-align: center; }
        .loader { border: 3px solid var(--eyxo-border); border-top: 3px solid var(--eyxo-blue); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .progress-bar-track { width: 100%; background: var(--eyxo-surface); border-radius: 4px; height: 4px; margin-top: 16px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--eyxo-blue); border-radius: 4px; transition: width 0.3s ease; width: 0%; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--eyxo-border); border-radius: 4px; }
        .panel { display: none; flex-direction: column; height: 100%; }
        .panel.active { display: flex; }
        .selection-controls { display: none; justify-content: flex-end; gap: 6px; margin-bottom: 10px; flex-shrink: 0; }
        .selection-controls.visible { display: flex; }
        .sel-btn { background: transparent; border: 1px solid var(--eyxo-border); color: var(--eyxo-text-muted); border-radius: 5px; padding: 4px 9px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; transition: all 0.15s; font-family: var(--eyxo-font-ui); }
        .sel-btn:hover { border-color: #555; color: var(--eyxo-text); background: var(--eyxo-surface); }
    </style>
</head>
<body>

    <div id="panel-setup" class="panel active">
        <h1>KA Compressor</h1>
        <p>Selecione os frames da página e defina o limite alvo de KB individualmente.</p>
        <div id="empty-selection" class="empty-state" style="display:none;">Nenhum frame encontrado nesta página.</div>
        <div id="selection-controls" class="selection-controls">
            <button class="sel-btn" id="btn-select-all">Marcar todas</button>
            <button class="sel-btn" id="btn-deselect-all">Desmarcar</button>
            <button class="sel-btn" id="btn-invert">Inverter</button>
        </div>
        <div id="selection-list" class="selection-list">
            <div style="text-align:center;padding:20px;color:#8F8F8F;font-size:13px;">Buscando frames...</div>
        </div>
        <button id="compress-btn" class="btn" disabled>COMPRIMIR SELEÇÃO</button>
        <div class="mono-font" style="text-align: center; margin-top: 15px; font-family: var(--eyxo-font-mono); font-size: 10px; color: var(--eyxo-text-muted);">v5.1.4</div>
    </div>

    <div id="panel-loading" class="panel">
        <div class="loader"></div>
        <div style="font-size:15px;font-weight:700;">OTIMIZANDO IMAGENS...</div>
        <p id="loading-progress" style="margin-top:8px;font-size:12px;font-family:var(--eyxo-font-mono);">Preparando...</p>
        <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-bar"></div></div>
    </div>

    <div id="panel-results" class="panel">
        <h1>Concluído!</h1>
        <p>Clique nas miniaturas para visualizar o tamanho real.</p>
        <div id="results-list" class="selection-list"></div>
        <div class="btn-group">
            <button id="download-all-btn" class="btn">BAIXAR PACOTE COMPLETO</button>
            <button id="download-compressed-btn" class="btn btn-outline" style="display:none;margin-top:0;">BAIXAR SÓ OTIMIZADAS</button>
            <button id="back-btn" class="btn btn-outline" style="margin-top:0;">OTIMIZAR OUTROS</button>
        </div>
    </div>

    <div id="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" src=""><p>Clique em qualquer lugar para fechar</p>
    </div>

    <script>
    // ═══════════════════════════════════════════════════════════════════════════
    // MOTOR DE COMPRESSÃO — UPNG.js (PNG 8-bit indexado, mesma abordagem do pngquant)
    //
    // Por que UPNG.js?
    //   - canvas.toBlob() só produz PNG 32-bit RGBA → arquivo grande
    //   - UPNG.encode() produz PNG 8-bit indexado → até 4x menor com mesma paleta
    //   - Inclui quantização k-means + FS dithering internamente
    //   - Resultado: mesma qualidade do servidor antigo, 100% local
    // ═══════════════════════════════════════════════════════════════════════════

    function tick() { return new Promise(r => setTimeout(r, 0)); }

    // ── Compressão principal via UPNG.js ─────────────────────────────────────
    // Estratégia:
    //   1. Decodifica o PNG original (UPNG.decode)
    //   2. Tenta sem redução de paleta (lossless 32-bit)
    //   3. Busca binária entre tamanhos de paleta (256 → 8 cores)
    //      - UPNG com cnum>0 gera PNG 8-bit indexado (muito menor)
    //      - Encontra o maior número de cores que ainda cabe no target
    // ─────────────────────────────────────────────────────────────────────────
    function applyFloydSteinberg(rgba, width, height, palette) {
        const out = new Uint8Array(rgba.length);
        const errors = new Float32Array(rgba.length);
        for (let i = 0; i < rgba.length; i++) errors[i] = rgba[i];
        
        function getClosestColor(r, g, b, a) {
            let minDest = Infinity;
            let best = palette[0];
            for(let i=0; i<palette.length; i++) {
                let p = palette[i];
                let dr = r - p[0], dg = g - p[1], db = b - p[2], da = a - p[3];
                let d = dr*dr + dg*dg + db*db + da*da;
                if (d < minDest) { minDest = d; best = p; }
            }
            return best;
        }

        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const i = (y * width + x) * 4;
                const r = errors[i], g = errors[i+1], b = errors[i+2], a = errors[i+3];
                
                const best = getClosestColor(r, g, b, a);
                out[i] = best[0]; out[i+1] = best[1]; out[i+2] = best[2]; out[i+3] = best[3];
                
                const er = r - best[0], eg = g - best[1], eb = b - best[2], ea = a - best[3];
                
                if (x + 1 < width) {
                    const idx = i + 4;
                    errors[idx]   += er * 0.4375; errors[idx+1] += eg * 0.4375;
                    errors[idx+2] += eb * 0.4375; errors[idx+3] += ea * 0.4375;
                }
                if (y + 1 < height) {
                    if (x - 1 >= 0) {
                        const idx = i + width * 4 - 4;
                        errors[idx]   += er * 0.1875; errors[idx+1] += eg * 0.1875;
                        errors[idx+2] += eb * 0.1875; errors[idx+3] += ea * 0.1875;
                    }
                    const idx2 = i + width * 4;
                    errors[idx2]   += er * 0.3125; errors[idx2+1] += eg * 0.3125;
                    errors[idx2+2] += eb * 0.3125; errors[idx2+3] += ea * 0.3125;
                    
                    if (x + 1 < width) {
                        const idx3 = i + width * 4 + 4;
                        errors[idx3]   += er * 0.0625; errors[idx3+1] += eg * 0.0625;
                        errors[idx3+2] += eb * 0.0625; errors[idx3+3] += ea * 0.0625;
                    }
                }
            }
        }
        return out;
    }

    async function compressImage(bytes, targetKb) {
        const targetBytes = targetKb > 0 ? targetKb * 1024 : 0;

        // Verifica se UPNG carregou (script tag no <head>)
        if (typeof UPNG === 'undefined') {
            throw new Error('UPNG.js não carregou. Verifique a conexão e reabra o plugin.');
        }

        // Decodifica PNG → obtém pixels RGBA brutos
        const buffer  = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
        const decoded = UPNG.decode(buffer);
        const rgba    = UPNG.toRGBA8(decoded)[0]; // ArrayBuffer
        const rgbaUint8 = new Uint8Array(rgba);
        const { width, height } = decoded;

        // 1. Tenta lossless primeiro
        const losslessBuffer = UPNG.encode([rgba], width, height, 0, [0]);
        if (targetBytes === 0 || losslessBuffer.byteLength <= targetBytes) {
            return new Blob([losslessBuffer], { type: 'image/png' });
        }

        // 2. Busca binária com Floyd-Steinberg Dithering
        const colorSteps = [256, 192, 128, 96, 64, 48, 32, 24, 16, 8];
        let lo = 0, hi = colorSteps.length - 1, bestBuffer = null;

        while (lo <= hi) {
            const mid      = (lo + hi) >> 1;
            const numColors = colorSteps[mid];
            await tick();

            try {
                // a) Usa UPNG para extrair a paleta Median-Cut ideal para `numColors`
                const qRes = UPNG.quantize([rgba.slice(0)], numColors);
                const qRgba = new Uint8Array(qRes.bufs[0]);
                const palette = [];
                const seen = new Set();
                for(let i=0; i<qRgba.length; i+=4) {
                     let r = qRgba[i], g = qRgba[i+1], b = qRgba[i+2], a = qRgba[i+3];
                     // UPNG.quantize premultiplica o alpha. Precisamos reverter para a paleta correta:
                     if (a > 0 && a < 255) {
                         r = Math.min(255, Math.max(0, Math.round(r * 255 / a)));
                         g = Math.min(255, Math.max(0, Math.round(g * 255 / a)));
                         b = Math.min(255, Math.max(0, Math.round(b * 255 / a)));
                     }
                     const c = (r<<24) | (g<<16) | (b<<8) | a;
                     if (!seen.has(c)) {
                         seen.add(c);
                         palette.push([r, g, b, a]);
                     }
                }

                // b) Aplica Floyd-Steinberg usando a paleta encontrada
                const ditheredRgba = applyFloydSteinberg(rgbaUint8, width, height, palette);

                // c) Empacota em PNG.
                // PASSAMOS 0 AQUI! Isso diz ao UPNG para não re-quantizar.
                // Como o ditheredRgba já tem <= 256 cores (da paleta), ele gera um PNG 8-bit indexado perfeito.
                const quantized = UPNG.encode([ditheredRgba.buffer], width, height, 0, [0]);
                
                if (quantized.byteLength <= targetBytes) {
                    bestBuffer = quantized;
                    hi = mid - 1; // tenta mais cores (melhor qualidade)
                } else {
                    lo = mid + 1; // precisa menos cores (mais compressão)
                }
            } catch (e) {
                lo = mid + 1;
            }
        }

        // Usa o melhor resultado encontrado, ou o menor possível
        const result = bestBuffer || UPNG.encode([rgba], width, height, 8, [0]);
        return new Blob([result], { type: 'image/png' });
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // UI
    // ═══════════════════════════════════════════════════════════════════════════

    const emptySelection    = document.getElementById('empty-selection');
    const selectionList     = document.getElementById('selection-list');
    const selectionControls = document.getElementById('selection-controls');
    const compressBtn       = document.getElementById('compress-btn');
    const resultsList       = document.getElementById('results-list');
    const downloadAllBtn    = document.getElementById('download-all-btn');
    const downloadCompressedBtn = document.getElementById('download-compressed-btn');
    const backBtn           = document.getElementById('back-btn');
    const loadingProgress   = document.getElementById('loading-progress');
    const progressBar       = document.getElementById('progress-bar');

    let finalImages = [], finalOriginals = [], objectUrlsToRevoke = [];

    function showPanel(id) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
    function formatBytes(b) { return b ? (b / 1024).toFixed(1) + ' KB' : '0 KB'; }

    function updateCompressButtonState() {
        const n = document.querySelectorAll('.frame-checkbox:checked').length;
        compressBtn.disabled = n === 0;
        compressBtn.textContent = n > 0 ? `COMPRIMIR ${n} ITEM(S)` : 'COMPRIMIR SELEÇÃO';
        document.querySelectorAll('.frame-checkbox').forEach(cb => {
            const card = document.getElementById(`item-${cb.value}`);
            if (card) card.classList.toggle('unchecked', !cb.checked);
        });
    }

    function openLightbox(url) {
        document.getElementById('lightbox-img').src = url;
        document.getElementById('lightbox').style.display = 'flex';
    }

    function toggleItem(event, id) {
        const cb = document.querySelector(`.frame-checkbox[value="${id}"]`);
        if (!cb) return;
        cb.checked = !cb.checked;
        updateCompressButtonState();
    }

    document.getElementById('btn-select-all').onclick   = () => { document.querySelectorAll('.frame-checkbox').forEach(cb => cb.checked = true);  updateCompressButtonState(); };
    document.getElementById('btn-deselect-all').onclick = () => { document.querySelectorAll('.frame-checkbox').forEach(cb => cb.checked = false); updateCompressButtonState(); };
    document.getElementById('btn-invert').onclick       = () => { document.querySelectorAll('.frame-checkbox').forEach(cb => cb.checked = !cb.checked); updateCompressButtonState(); };

    // ── Mensagens do Figma (code.js) ──────────────────────────────────────────
    window.onmessage = async (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;

        if (msg.type === 'initial-list') {
            const items = msg.items;
            if (!items.length) {
                emptySelection.style.display = 'block';
                selectionList.style.display  = 'none';
                selectionControls.classList.remove('visible');
                compressBtn.disabled = true;
            } else {
                emptySelection.style.display = 'none';
                selectionList.style.display  = 'flex';
                selectionControls.classList.add('visible');
                selectionList.innerHTML = items.map(item => `
                    <div class="file-item" id="item-${item.id}" onclick="toggleItem(event,'${item.id}')">
                        <input type="checkbox" class="frame-checkbox" value="${item.id}" checked tabindex="-1" onclick="event.stopPropagation()" onchange="updateCompressButtonState()">
                        <img id="thumb-${item.id}" class="file-item-thumb" style="display:none;" onclick="event.stopPropagation();openLightbox(this.src)">
                        <div class="file-item-info">
                            <div class="file-item-name">${item.name}</div>
                            <div class="file-item-meta" id="size-${item.id}">Calculando peso...</div>
                        </div>
                        <div class="target-input-group" onclick="event.stopPropagation()">
                            <select class="kb-input" id="kb-${item.id}">
                                <option value="100">100</option>
                                <option value="200" selected>200</option>
                                <option value="300">300</option>
                                <option value="500">500</option>
                                <option value="0">MAX</option>
                            </select>
                            <span class="kb-suffix">KB</span>
                        </div>
                    </div>`).join('');
                updateCompressButtonState();
            }
        }

        if (msg.type === 'size-update') {
            const sizeLabel = document.getElementById(`size-${msg.id}`);
            const thumbImg  = document.getElementById(`thumb-${msg.id}`);
            if (sizeLabel) sizeLabel.textContent = formatBytes(msg.size);
            if (thumbImg && msg.thumbBytes) {
                const blob = new Blob([msg.thumbBytes], { type: 'image/png' });
                const url  = URL.createObjectURL(blob);
                objectUrlsToRevoke.push(url);
                thumbImg.src = url; thumbImg.style.display = 'block';
                thumbImg.onclick = (e) => { e.stopPropagation(); openLightbox(url); };
            }
        }
        if (msg.type === 'size-error') {
            const el = document.getElementById(`size-${msg.id}`);
            if (el) el.textContent = 'Erro ao ler peso';
        }
        if (msg.type === 'error') { showPanel('panel-setup'); alert(msg.message); }

        // ── Bytes prontos: comprime localmente via UPNG ────────────────────────
        if (msg.type === 'selection-bytes-ready') {
            finalImages = []; finalOriginals = []; resultsList.innerHTML = '';
            const toCompress = msg.compressedImages || [];
            const toKeep     = msg.originalImages   || [];

            // Originais intactos (não marcados) — passa direto sem reprocessar
            for (const img of toKeep) {
                const blob = new Blob([img.bytes], { type: 'image/png' });
                const url  = URL.createObjectURL(blob);
                objectUrlsToRevoke.push(url);
                finalOriginals.push({ name: `${img.name}.png`, blob });
                resultsList.innerHTML += `
                    <div class="file-item is-original">
                        <img src="${url}" class="file-item-thumb" onclick="openLightbox('${url}')">
                        <div class="file-item-info">
                            <div class="file-item-name">${img.name}.png</div>
                            <div class="file-item-meta"><span class="badge-original">ORIGINAL INTACTO</span> · ${formatBytes(img.original_size)}</div>
                        </div>
                    </div>`;
            }

            try {
                for (let i = 0; i < toCompress.length; i++) {
                    const img = toCompress[i];
                    loadingProgress.textContent = `${i + 1}/${toCompress.length}: ${img.name}.png`;
                    progressBar.style.width = Math.round((i / toCompress.length) * 100) + '%';
                    await tick();

                    const compressedBlob = await compressImage(
                        new Uint8Array(img.bytes),
                        parseInt(img.target_kb) || 200
                    );

                    const url    = URL.createObjectURL(compressedBlob);
                    objectUrlsToRevoke.push(url);

                    const kbSize  = Math.round(compressedBlob.size / 1024);
                    let finalName = `${img.name}.png`;
                    if (/^\d+/.test(img.name)) {
                        finalName = `${img.name}.png`.replace(/^\d+(_?)/, `${kbSize}_`);
                    }

                    finalImages.push({ name: finalName, blob: compressedBlob });
                    resultsList.innerHTML += `
                        <div class="file-item is-original" style="cursor:default;">
                            <img src="${url}" class="file-item-thumb" onclick="openLightbox('${url}')">
                            <div class="file-item-info">
                                <div class="file-item-name">${finalName}</div>
                                <div class="file-item-meta"><del>${formatBytes(img.original_size)}</del> → <span class="ok">${formatBytes(compressedBlob.size)}</span></div>
                            </div>
                        </div>`;
                }

                progressBar.style.width = '100%';

                if (finalOriginals.length > 0) {
                    downloadAllBtn.textContent = 'BAIXAR PACOTE COMPLETO';
                    downloadCompressedBtn.style.display = 'flex';
                    downloadCompressedBtn.textContent = finalImages.length === 1 ? 'BAIXAR SÓ OTIMIZADA' : 'BAIXAR SÓ AS OTIMIZADAS';
                } else {
                    downloadAllBtn.textContent = finalImages.length === 1 ? 'BAIXAR IMAGEM' : 'BAIXAR ARQUIVOS (ZIP)';
                    downloadCompressedBtn.style.display = 'none';
                }
                showPanel('panel-results');

            } catch (e) {
                showPanel('panel-setup');
                alert('Erro na compressão: ' + e.message);
                console.error(e);
            }
        }
    };

    compressBtn.onclick = () => {
        const toCompress = [], toKeep = [];
        document.querySelectorAll('.frame-checkbox').forEach(cb => {
            const id = cb.value;
            if (cb.checked) toCompress.push({ id, targetKb: document.getElementById(`kb-${id}`).value || 200 });
            else            toKeep.push({ id });
        });
        if (!toCompress.length) return;
        progressBar.style.width = '0%';
        loadingProgress.textContent = 'Preparando...';
        showPanel('panel-loading');
        parent.postMessage({ pluginMessage: { type: 'compress-selected', toCompress, toKeep } }, '*');
    };

    // ── Download: arquivo avulso ou ZIP via JSZip ─────────────────────────────
    let _jszip = null;
    async function loadJSZip() {
        if (_jszip) return _jszip;
        await new Promise((res, rej) => {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
            s.onload = res; s.onerror = rej;
            document.head.appendChild(s);
        });
        return (_jszip = window.JSZip);
    }

    async function performDownload(imgs, btn) {
        const orig = btn.textContent;
        btn.textContent = 'AGUARDE...'; btn.disabled = true;
        try {
            if (imgs.length === 1) {
                const url = URL.createObjectURL(imgs[0].blob);
                const a = document.createElement('a');
                a.href = url; a.download = imgs[0].name;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } else {
                const JSZip = await loadJSZip();
                const zip = new JSZip();
                for (const img of imgs) zip.file(img.name, img.blob);
                const zb = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
                const url = URL.createObjectURL(zb);
                const a = document.createElement('a');
                
                let zipName = 'EYXO_Pacote_Final.zip';
                if (imgs.length > 0) {
                    let base = imgs[0].name.replace(/\.png$/i, '');
                    base = base.replace(/^\d+_/, ''); // remove peso inicial
                    
                    // Remove formato e resolução (ex: _PopUp_884x1178 -> remove _PopUp_884x1178)
                    let clean = base.replace(/_[^_]+_\d+x\d+$/, '');
                    if (clean && clean !== base) {
                        base = clean;
                    } else {
                        // Fallback: remove só a resolução
                        base = base.replace(/_\d+x\d+$/, '');
                    }
                    
                    if (base) zipName = base + '.zip';
                }
                
                a.href = url; a.download = zipName;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        } catch (e) { alert('Erro ao baixar: ' + e.message); }
        finally { btn.textContent = orig; btn.disabled = false; }
    }

    downloadAllBtn.onclick = () => performDownload([...finalOriginals, ...finalImages], downloadAllBtn);
    downloadCompressedBtn.onclick = () => performDownload(finalImages, downloadCompressedBtn);
    backBtn.onclick = () => {
        showPanel('panel-setup');
        progressBar.style.width = '0%';
        objectUrlsToRevoke.forEach(u => URL.revokeObjectURL(u));
        objectUrlsToRevoke = [];
    };
    </script>
</body>
